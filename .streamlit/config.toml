# tema de la demo (app_demo.py): modo claro con alto contraste para proyectar y acento
# verde azulado (One Health). Rojo, ámbar y verde se reservan para el nivel de riesgo.
[theme]
base = "light"
primaryColor = "#0f766e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eef3f2"
textColor = "#0b1220"

# barra superior minima: oculta el boton "Deploy" y el menu de desarrollo
[client]
toolbarMode = "minimal"
